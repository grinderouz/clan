<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>Grinderouz | 404 Not Found</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #111827;
            --bg-section-alt: #0f172a;
            --bg-card: #1e293b;
            
            --border-dark: #000000;
            --text-main: #f8fafc;
            --text-muted: #9ca3af;
            
            --accent-gold: #FFD700;
            --accent-gold-hover: #FACC15;
            
            --accent-blue: #3b82f6;
            --accent-blue-hover: #60a5fa;
            --accent-blue-shadow: #1d4ed8;
            
            --font-heading: 'Lilita One', cursive;
            --font-body: 'Montserrat', sans-serif;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: var(--font-body);
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, rgba(30,58,138,0.5) 0%, transparent 70%);
        }
        h1, h2, h3 {
            font-family: var(--font-heading);
            font-weight: normal;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        ::selection {
            background: rgba(96, 165, 250, 0.25);
        }
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 60px 20px;
            position: relative;
            z-index: 10;
        }
        .bg-icon {
            position: absolute;
            pointer-events: none;
            user-select: none;
            z-index: -1;
        }
        .bg-icon.left {
            left: 5%;
            top: 25%;
            font-size: 8rem;
            color: rgba(59, 130, 246, 0.1);
            transform: rotate(-12deg);
        }
        .bg-icon.right {
            right: 5%;
            bottom: 25%;
            font-size: 10rem;
            color: rgba(234, 179, 8, 0.1);
            transform: rotate(6deg);
        }
        @media (max-width: 768px) {
            .bg-icon { display: none; }
        }
        .sc-heading {
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0px 5px 0 rgba(0,0,0,0.5);
            letter-spacing: 2px;
            line-height: 1.1;
        }
        .text-gold { color: var(--accent-gold); }
        .text-red { color: #f87171; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-heading);
            font-size: 1.25rem;
            color: #fff;
            padding: 12px 32px;
            border-radius: 12px;
            border: 2px solid var(--border-dark);
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(.4,0,.2,1);
            text-transform: uppercase;
        }
        .btn-blue {
            background: linear-gradient(to bottom, var(--accent-blue-hover), var(--accent-blue));
            box-shadow: 0 6px 0 var(--accent-blue-shadow), 0 10px 10px rgba(0,0,0,0.16);
        }
        .btn-blue:hover {
            transform: scale(1.05);
            background: linear-gradient(to bottom, #93c5fd, var(--accent-blue-hover));
        }
        .btn-blue:active { 
            transform: scale(1.05) translateY(4px); 
            box-shadow: 0 2px 0 var(--accent-blue-shadow), 0 4px 8px rgba(0,0,0,0.08);
        }
        .card-404 {
            background-color: var(--bg-card);
            border: 3px solid rgba(127, 29, 29, 0.6);
            border-radius: 16px;
            box-shadow: 0 8px 30px 0 rgba(0,0,0,0.48), inset 0 3px 0 rgba(255,255,255,0.07);
            position: relative;
            overflow: visible;
            animation: pop-in 0.7s cubic-bezier(.17,.67,.6,1.36);
            padding: 56px 40px;
            text-align: center;
            max-width: 650px;
            width: 100%;
        }

        @keyframes pop-in {
            0%   { opacity: 0; transform: scale(0.98) translateY(30px); }
            70%  { opacity: 1; transform: scale(1.04) translateY(-6px); }
            100% { opacity: 1; transform: scale(1.0) translateY(0); }
        }
        .emoji-wrapper {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-card);
            border-radius: 50%;
            padding: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            margin-bottom: 12px;
        }

        .small-cap {
            letter-spacing: 1.5px;
            font-size: 1rem;
            color: rgba(251, 191, 36, 0.8);
            margin-top: -12px;
            margin-bottom: 20px;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            font-family: var(--font-heading);
            text-transform: uppercase;
        }

        .huge-number {
            font-size: clamp(4.5rem, 10vw, 6rem);
            margin-bottom: 8px;
            text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000, 0px 7px 0 rgba(0,0,0,0.65);
            letter-spacing: 0.12em;
        }

        .subtitle {
            font-size: clamp(1.5rem, 4vw, 2.25rem);
            margin-bottom: 24px;
            color: var(--text-main);
        }

        .divider {
            width: 96px;
            height: 8px;
            background: linear-gradient(to right, #ef4444, #fbbf24, #facc15);
            margin: 0 auto 28px auto;
            border-radius: 4px;
            border: 1px solid var(--border-dark);
            box-shadow: 0 2px 0 #000;
            opacity: 0.7;
        }

        .message-text {
            font-size: 1.15rem;
            color: #cbd5e1;
            font-weight: 600;
            margin-bottom: 48px;
            line-height: 1.6;
        }
        .message-highlight { color: #fef08a; }

        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: var(--bg-section-alt); border-left: 1px solid var(--bg-card); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, var(--accent-gold-hover), var(--accent-gold));
            border: 3px solid var(--bg-section-alt);
            border-radius: 10px;
        }

    </style>
</head>
<body>

    <div id="navbar-container"></div>

    <main>
        <div class="bg-icon left"><i class="fa-solid fa-shield"></i></div>
        <div class="bg-icon right"><i class="fa-solid fa-khanda"></i></div>
        
        <div class="card-404">
            
            <div class="emoji-wrapper">
                <p data-emojis data-emoji-size="70px">:404:</p>
            </div>

            <h1 class="sc-heading text-red huge-number">404</h1>
            
            <h2 class="sc-heading subtitle">
                You just hit a <span class="text-gold">dead end</span>.
            </h2>

            <div class="divider"></div>
            
            <p class="message-text">
                The page you’re looking for wasn’t found.<br><br>
                <span class="message-highlight">Don’t worry you can always go back to the Homepage!</span>
            </p>

            <a href="index.html" class="btn btn-blue">
                <i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i> Back to Home
            </a>
        </div>
    </main>
    
    <div id="footer-container"></div>
    
    <script src="emojis.js"></script>
    <script src="componets.js"></script>
</body>
</html>
