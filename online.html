<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>Grinderouz | Online Subscribers</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-section-alt: #0f172a;
            --bg-card: #151f32;
            --bg-card-header: #1e293b;
            --nav-footer-match: #020617;
            --border-dark: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #9ca3af;
            --text-dark: #0f172a;
            --accent-gold: #FFD700;
            --accent-gold-hover: #FACC15;
            --accent-gold-shadow: rgba(245, 158, 11, 0.2);
            --accent-blue: #3b82f6;
            --accent-blue-hover: #60a5fa;
            --accent-blue-shadow: rgba(59, 130, 246, 0.2);
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --accent-purple: #a855f7;
            /* Restored original font-heading so componets.js navbar renders natively */
            --font-heading: 'Lilita One', cursive; 
            --font-body: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: var(--font-body);
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        h1, h2, h3, h4 {
            font-family: var(--font-heading);
            font-weight: normal;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        ul {
            list-style: none;
        }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, var(--accent-gold), var(--accent-gold-hover));
            border-radius: 10px;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        .text-center { text-align: center; }
        .grid { display: grid; gap: 30px; }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        
        .sc-heading {
            text-shadow: none;
            letter-spacing: 2px;
        }
        .text-gold { 
            color: var(--accent-gold); 
            background: linear-gradient(135deg, #ffe57f 0%, #ffb300 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .section-padding { padding: 100px 0; }
        .section-title-wrapper { margin-bottom: 70px; padding-top: 20px; }
        .section-title { 
            font-size: 3rem; 
            line-height: 1.2; 
            letter-spacing: 1px;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .title-underline {
            width: 80px;
            height: 4px;
            background-color: var(--accent-blue);
            margin: 20px auto 0;
            border-radius: 10px;
        }
        .title-underline.gold { 
            background: linear-gradient(90deg, var(--accent-gold), #f59e0b); 
        }

        /* Sleek Modern Premium Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-dark);
            border-radius: 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            position: relative;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.9);
        }
        .card-header {
            width: 100%;
            padding: 40px 20px 60px 20px;
            border-bottom: 1px solid var(--border-dark);
            position: relative;
        }

        .tier-basic .card-header { background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, transparent 100%); }
        .tier-ultimate .card-header { background: linear-gradient(135deg, rgba(112, 185, 16, 0.15) 0%, transparent 100%); }
        .tier-creators .card-header { background: linear-gradient(135deg, rgba(201, 185, 114, 0.15) 0%, transparent 100%); }
        
        .tier-ultimate { border-color: rgba(16, 185, 129, 0.2); }
        .tier-ultimate:hover { border-color: rgba(16, 185, 129, 0.4); }
        .tier-creators { border-color: rgba(251, 191, 36, 0.2); }
        .tier-creators:hover { border-color: rgba(251, 191, 36, 0.4); }

        .avatar-box {
            width: 90px;
            height: 90px;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-family: var(--font-heading);
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin: -45px auto 20px auto;
            position: relative;
            z-index: 2;
            transition: transform 0.3s ease;
        }
        .card:hover .avatar-box {
            transform: scale(1.05);
        }
        .subscriber-name {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.5px;
        }
        
        .badge-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 18px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            box-shadow: none;
            border: 1px solid transparent;
        }
        .tier-basic .badge-label { background-color: rgba(59, 130, 246, 0.15); color: #60a5fa; border-color: rgba(59, 130, 246, 0.3); }
        .tier-ultimate .badge-label { background-color: rgba(16, 185, 129, 0.15); color: #34d399; border-color: rgba(16, 185, 129, 0.3); }
        .tier-creators .badge-label { background-color: rgba(251, 191, 36, 0.15); color: #fbbf24; border-color: rgba(251, 191, 36, 0.3); }
        
        .member-since {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .card-body {
            padding: 0 24px 30px 24px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .subscribers-hero {
            padding-top: 100px;
            background-image: radial-gradient(circle at 50% -10%, rgba(59, 130, 246, 0.08) 0%, transparent 60%);
        }
    </style>
    <script type="module">
        import { renderNavbar, renderFooter } from "./@components.js";
        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar();
            renderFooter();
        });
    </script>
</head>
<body>

    <div id="navbar-container"></div>

    <main class="subscribers-hero">
        <section class="section-padding" style="padding-top: 40px;">
            <div class="container">
                <div class="text-center section-title-wrapper">
                    <h2 class="sc-heading section-title">OUR <span class="text-gold">ONLINE</span> SUBSCRIBERS</h2>
                    <p style="font-size: 1.1rem; color: var(--text-muted); margin-top: 18px; font-weight: 500; letter-spacing: 0.3px;">
                        Recognizing the legends who support the Grinderouz network.
                    </p>
                    <div class="title-underline gold"></div>
                </div>
                <div id="subscribers-grid" class="grid grid-3"></div>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>

    <script>
        const SUBSCRIBERS = [
            {
                name: "MAYO",
                badge: "ultimate",
                memberSince: "July 7, 2026"
            },
            {
                name: "ITZDRAKO",
                badge: "ultimate",
                memberSince: "July 12, 2026"
            }
        ];

        function renderSubscribers() {
            const grid = document.getElementById('subscribers-grid');
            grid.innerHTML = '';

            SUBSCRIBERS.forEach(sub => {
                let tierClass = "";
                let emojiShortcode = "";
                let displayRole = "";

                switch(sub.badge.toLowerCase()) {
                    case "creators":
                        tierClass = "tier-creators";
                        emojiShortcode = ":online-creators:";
                        displayRole = "Creator";
                        break;
                    case "ultimate":
                        tierClass = "tier-ultimate";
                        emojiShortcode = ":online-ultimate:";
                        displayRole = "Ultimate";
                        break;
                    case "basic":
                    default:
                        tierClass = "tier-basic";
                        emojiShortcode = ":online-basic:";
                        displayRole = "Basic";
                        break;
                }

                const initial = sub.name.charAt(0).toUpperCase();

                const cardHTML = `
                    <div class="card ${tierClass}">
                        <div class="card-header"></div>
                        <div class="card-body">
                            <div class="avatar-box sc-heading">
                                ${initial}
                            </div>
                            <h3 class="sc-heading subscriber-name">${sub.name}</h3>
                            <div class="badge-label">
                                <span data-emojis data-emoji-size="20px">${emojiShortcode}</span>
                                ${displayRole}
                            </div>
                            <div class="member-since">
                                <i class="fa-solid fa-calendar-days" style="margin-right: 6px; color: var(--accent-blue);"></i> Member Since: ${sub.memberSince}
                            </div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function processEmojis() {
            const EMOJI_DATA = {
                "online-basic": "assets/emojis/online-basic.png",
                "online-ultimate": "assets/emojis/online-ultimate.png",
                "online-creators": "assets/emojis/online-creators.png",
            };
            const elements = document.querySelectorAll('[data-emojis]');
            elements.forEach(el => {
                if (el && el.innerHTML) {
                    const size = el.getAttribute('data-emoji-size') || "22px";
                    const style = `display: inline-block; width: ${size}; height: ${size}; vertical-align: bottom; margin: 0 4px; object-fit: contain;`;
                    
                    el.innerHTML = el.innerHTML.replace(/:([a-z0-9_-]+):/gi, function(match, p1) {
                        const emojiPath = EMOJI_DATA[p1.toLowerCase()];
                        if (emojiPath) {
                            return `<img src="${emojiPath}" alt="${p1}" title=":${p1}:" style="${style}" onerror="this.outerHTML='<i class=\\'fa-solid fa-gem\\' style=\\'margin-right: 5px;\\'></i>'">`;
                        }
                        return match;
                    });
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderSubscribers();
            setTimeout(processEmojis, 100); 
        });
    </script>
    <script src="uptoggle.js"></script>
    <script src="componets.js"></script>
</body>
</html>
