<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>Grinderouz | Online Subscribers</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #111827;
            --bg-section-alt: #0f172a;
            --bg-card: #1e293b;
            --bg-card-header: #334155;
            --nav-footer-match: #020617;
            --border-dark: #000000;
            --text-main: #f8fafc;
            --text-muted: #9ca3af;
            --text-dark: #1e293b;
            --accent-gold: #FFD700;
            --accent-gold-hover: #FACC15;
            --accent-gold-shadow: #a16207;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #60a5fa;
            --accent-blue-shadow: #1d4ed8;
            --accent-red: #ef4444;
            --accent-green: #22c55e;
            --accent-purple: #a855f7;
            --font-heading: 'Lilita One', cursive;
            --font-body: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: var(--font-body);
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        h1, h2, h3, h4 {
            font-family: var(--font-heading);
            font-weight: normal;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        ul {
            list-style: none;
        }
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: var(--bg-section-alt); border-left: 1px solid var(--bg-card); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, var(--accent-gold-hover), var(--accent-gold));
            border: 3px solid var(--bg-section-alt);
            border-radius: 10px;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .text-center { text-align: center; }
        .grid { display: grid; gap: 24px; }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
        .sc-heading {
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0px 5px 0 rgba(0,0,0,0.6);
        }
        .text-gold { color: var(--accent-gold); }
        .section-padding { padding: 80px 0; }
        .section-title-wrapper { margin-bottom: 60px; padding-top: 40px; }
        .section-title { font-size: 3.5rem; line-height: 1.1; }
        .title-underline {
            width: 120px;
            height: 8px;
            background-color: var(--accent-blue);
            margin: 16px auto 0;
            border-radius: 4px;
            border: 1px solid var(--border-dark);
        }
        .title-underline.gold { background-color: var(--accent-gold); }
        .card {
            background-color: var(--bg-card);
            border: 3px solid var(--border-dark);
            border-radius: 16px;
            box-shadow: inset 0 3px 0 rgba(255,255,255,0.1), 0 8px 15px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card-header {
            width: 100%;
            padding: 30px 20px 50px 20px;
            border-bottom: 3px solid var(--border-dark);
            position: relative;
        }
        .tier-basic .card-header { background: linear-gradient(to bottom, #69baff, #1e293b); }
        .tier-ultimate .card-header { background: linear-gradient(to bottom, #7bff03, #1e293b); }
        .tier-creators .card-header { background: linear-gradient(to bottom, #f9ffae, #1e293b); }
        .avatar-box {
            width: 80px;
            height: 80px;
            background: var(--bg-section-alt);
            border: 4px solid var(--border-dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--text-muted);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin: -40px auto 16px auto;
            position: relative;
            z-index: 2;
        }
        .subscriber-name {
            font-size: 1.75rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }
        .badge-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 8px;
            border: 2px solid var(--border-dark);
            font-family: var(--font-heading);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
            margin-bottom: 16px;
        }
        .tier-basic .badge-label { background-color: #69baff; color: var(--text-dark); }
        .tier-ultimate .badge-label { background-color: #7bff03; color: #000000; }
        .tier-creators .badge-label { background-color: #f9ffae; color: var(--text-dark); }
        .member-since {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(0,0,0,0.2);
            padding: 6px 12px;
            border-radius: 6px;
            margin-bottom: 24px;
        }
        .card-body {
            padding: 0 20px 20px 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .subscribers-hero {
            padding-top: 120px;
            background-image: radial-gradient(circle at 50% -20%, rgba(59, 130, 246, 0.2) 0%, transparent 70%);
        }
    </style>
    <script type="module">
        import { renderNavbar, renderFooter } from "./@components.js";
        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar();
            renderFooter();
        });
    </script>
</head>
<body>

    <div id="navbar-container"></div>

    <main class="subscribers-hero">
        <section class="section-padding" style="padding-top: 20px;">
            <div class="container">
                <div class="text-center section-title-wrapper">
                    <h2 class="sc-heading section-title">OUR <span class="text-gold">ONLINE</span> SUBSCRIBERS</h2>
                    <p style="font-size: 1.1rem; color: var(--text-muted); margin-top: 16px; font-weight: 600;">
                        Recognizing the legends who support the Grinderouz network.
                    </p>
                    <div class="title-underline gold"></div>
                </div>
                <div id="subscribers-grid" class="grid grid-3"></div>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>

    <script>
        const SUBSCRIBERS = [
            {
                name: "MAYO",
                badge: "basic",
                memberSince: "July 7, 2026"
            }
        ];

        function renderSubscribers() {
            const grid = document.getElementById('subscribers-grid');
            grid.innerHTML = '';

            SUBSCRIBERS.forEach(sub => {
                let tierClass = "";
                let emojiShortcode = "";
                let displayRole = "";

                switch(sub.badge.toLowerCase()) {
                    case "creators":
                        tierClass = "tier-creators";
                        emojiShortcode = ":online-creators:";
                        displayRole = "Creator";
                        break;
                    case "ultimate":
                        tierClass = "tier-ultimate";
                        emojiShortcode = ":online-ultimate:";
                        displayRole = "Ultimate";
                        break;
                    case "basic":
                    default:
                        tierClass = "tier-basic";
                        emojiShortcode = ":online-basic:";
                        displayRole = "Basic";
                        break;
                }

                const initial = sub.name.charAt(0).toUpperCase();

                const cardHTML = `
                    <div class="card ${tierClass}">
                        <div class="card-header"></div>
                        <div class="card-body">
                            <div class="avatar-box sc-heading">
                                ${initial}
                            </div>
                            <h3 class="sc-heading subscriber-name">${sub.name}</h3>
                            <div class="badge-label">
                                <span data-emojis data-emoji-size="24px">${emojiShortcode}</span>
                                ${displayRole}
                            </div>
                            <div class="member-since">
                                <i class="fa-solid fa-calendar-days" style="margin-right: 6px;"></i> Member Since: ${sub.memberSince}
                            </div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function processEmojis() {
            const EMOJI_DATA = {
                "online-basic": "assets/emojis/online-basic.png",
                "online-ultimate": "assets/emojis/online-ultimate.png",
                "online-creators": "assets/emojis/online-creators.png",
            };
            const elements = document.querySelectorAll('[data-emojis]');
            elements.forEach(el => {
                if (el && el.innerHTML) {
                    const size = el.getAttribute('data-emoji-size') || "22px";
                    const style = `display: inline-block; width: ${size}; height: ${size}; vertical-align: bottom; margin: 0 4px; object-fit: contain;`;
                    
                    el.innerHTML = el.innerHTML.replace(/:([a-z0-9_-]+):/gi, function(match, p1) {
                        const emojiPath = EMOJI_DATA[p1.toLowerCase()];
                        if (emojiPath) {
                            return `<img src="${emojiPath}" alt="${p1}" title=":${p1}:" style="${style}" onerror="this.outerHTML='<i class=\\'fa-solid fa-gem\\' style=\\'margin-right: 5px;\\'></i>'">`;
                        }
                        return match;
                    });
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderSubscribers();
            setTimeout(processEmojis, 100); 
        });
    </script>
    <script src="uptoggle.js"></script>
    <script src="componets.js"></script>
</body>
</html>
